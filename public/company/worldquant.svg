<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="wq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07152b" />
      <stop offset="100%" stop-color="#0d284f" />
    </linearGradient>
    <linearGradient id="wq-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#90e0ef" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="200" height="200" rx="40" fill="url(#wq-bg)" />
  
  <!-- Stylized Geometric WQ Quantitative Symbol -->
  <g transform="translate(30, 36)">
    <!-- Stylized W lines -->
    <path d="M15 25 L42 92 L68 35 L94 92 L125 25" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Accent Quantitative Data / Brain Node -->
    <circle cx="68" cy="35" r="7" fill="url(#wq-accent)" />
    <circle cx="42" cy="92" r="6" fill="url(#wq-accent)" />
    <circle cx="94" cy="92" r="6" fill="url(#wq-accent)" />
    <line x1="20" y1="106" x2="120" y2="106" stroke="url(#wq-accent)" stroke-width="3.5" stroke-linecap="round" />
  </g>
  
  <!-- Text Label -->
  <text x="100" y="172" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="16" 
        font-weight="800" 
        letter-spacing="2.5" 
        fill="#ffffff" 
        text-anchor="middle">WORLDQUANT</text>
</svg>
